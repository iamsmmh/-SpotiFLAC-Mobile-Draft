name: Release (signed, upstream)

# NOTE: this is the upstream pipeline. It requires an Android keystore
# (KEYSTORE_BASE64 / KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD) plus the
# AltStore and Telegram secrets. Tag releases in this fork are produced by
# `unsigned-release.yml`, which needs no secrets and no developer account, so
# the tag trigger is disabled here to avoid two workflows racing for the same
# release. Run this manually if you have the signing secrets configured.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$VERSION_LOWER" == *"-preview"* ]] || [[ "$VERSION_LOWER" == *"-beta"* ]] || [[ "$VERSION_LOWER" == *"-rc"* ]] || [[ "$VERSION_LOWER" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Release gate
        # Refuses the release when repo-level metadata is inconsistent:
        # tag vs pubspec version, CHANGELOG coverage, AltStore feed integrity
        # (bundle id / date fields), and unbounded staged-strings debt.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release_gate.py --version "$VERSION"

  build-android:
    runs-on: ubuntu-latest
    needs: get-version
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # NDK 29.0.14206865 is preinstalled on the ubuntu-latest runner image at
      # /usr/local/lib/android/sdk/ndk/29.0.14206865, so it is not cached here
      # (restoring over existing files makes /usr/bin/tar exit 2). setup-
      # android-sdk.sh detects the preinstalled NDK and skips installation.

      - name: Install Android SDK & NDK
        run: |
          bash .github/scripts/setup-android-sdk.sh
        env:
          ANDROID_NDK_VERSION: "29.0.14206865"
          ANDROID_PLATFORM: "platforms;android-37"
          ANDROID_BUILD_TOOLS: "build-tools;35.0.0"

      - name: Install gomobile
        working-directory: go_backend
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init

      - name: Build Go backend for Android
        working-directory: go_backend
        run: |
          mkdir -p ../android/app/libs
          gomobile bind -target=android/arm,android/arm64,android/amd64 -androidapi 24 -o ../android/app/libs/gobackend.aar .
        env:
          CGO_ENABLED: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK (Release - unsigned)
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Build AAB (Release)
        run: |
          bash scripts/flutter_build_appbundle.sh
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Sign APKs
        if: env.KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_arm64
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Sign AAB
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            build/app/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Rename APKs
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          cd build/app/outputs/flutter-apk

          rename_required_apk() {
            unsigned="$1"; destination="$2"
            signed="${unsigned%.apk}-signed.apk"
            if [ -f "$signed" ]; then mv "$signed" "$destination"
            elif [ -f "$unsigned" ]; then mv "$unsigned" "$destination"
            else echo "ERROR: Missing APK: $unsigned"; exit 1; fi
          }

          rename_required_apk app-arm64-v8a-release.apk   "SpotiFLAC-${VERSION}-arm64.apk"
          rename_required_apk app-armeabi-v7a-release.apk "SpotiFLAC-${VERSION}-arm32.apk"
          rename_required_apk app-x86_64-release.apk      "SpotiFLAC-${VERSION}-x86_64.apk"
          ls -la

      - name: Collect AAB
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p build/app/outputs/bundle/release
          cp build/app/outputs/bundle/release/app-release.aab \
            "build/app/outputs/bundle/release/SpotiFLAC-${VERSION}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/SpotiFLAC-*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/SpotiFLAC-*.aab

  build-ios:
    runs-on: macos-15
    needs: get-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh
        env:
          XCODE_VERSION: "26.1.1"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Install gomobile
        working-directory: go_backend
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init

      - name: Build Go backend for iOS
        working-directory: go_backend
        run: |
          mkdir -p ../ios/Frameworks
          gomobile bind -target=ios -tags ios -o ../ios/Frameworks/Gobackend.xcframework .
        env:
          CGO_ENABLED: 1

      - name: Verify XCFramework created
        run: |
          ls -la ios/Frameworks/
          ls -la ios/Frameworks/Gobackend.xcframework/ || (echo "ERROR: XCFramework not found!" && exit 1)

      - name: Add XCFramework to Xcode project
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj
          cat > add_framework.rb << 'EOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          frameworks_group = project.main_group.find_subpath('Frameworks', true)
          frameworks_group ||= project.main_group.new_group('Frameworks')
          framework_path = 'Frameworks/Gobackend.xcframework'
          existing = frameworks_group.files.find { |f| f.path == framework_path }
          unless existing
            framework_ref = frameworks_group.new_file(framework_path, :project)
            target.frameworks_build_phase.add_file_reference(framework_ref)
            embed_phase = target.build_phases.find { |p| p.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && p.name == 'Embed Frameworks' }
            if embed_phase
              build_file = embed_phase.add_file_reference(framework_ref)
              build_file.settings = { 'ATTRIBUTES' => ['CodeSignOnCopy', 'RemoveHeadersOnCopy'] }
            end
            project.save
            puts "Successfully added Gobackend.xcframework to Xcode project"
          else
            puts "Gobackend.xcframework already linked"
          end
          EOF
          ruby add_framework.rb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_full*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build iOS (unsigned)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only
          (cd ios && pod install)
          bash .github/scripts/archive-ios.sh \
            "$PWD/ios/build/Runner.xcarchive" \
            "${RUNNER_TEMP}/xcodebuild-archive.log"

      - name: Create IPA
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          mkdir -p build/ios/ipa
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r $GITHUB_WORKSPACE/build/ios/ipa/SpotiFLAC-${VERSION}-ios-unsigned.ipa Payload
          rm -rf Payload

      - name: Verify IPA created
        run: |
          ls -la build/ios/ipa/
          VERSION=${{ needs.get-version.outputs.version }}
          if [ ! -f "build/ios/ipa/SpotiFLAC-${VERSION}-ios-unsigned.ipa" ]; then
            echo "ERROR: IPA not created!"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: build/ios/ipa/SpotiFLAC-*.ipa

  create-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-android, build-ios]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.txt

      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: ./release

      - name: Download Android AAB
        uses: actions/download-artifact@v7
        with:
          name: android-aab
          path: ./release

      - name: Download iOS IPA
        uses: actions/download-artifact@v7
        with:
          name: ios-ipa
          path: ./release

      - name: Generate SHA-256 checksums
        working-directory: ./release
        run: |
          set -euo pipefail
          shopt -s nullglob
          sha256sum -- *.apk *.aab *.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          CURRENT_REF=$(git rev-list -n 1 "$VERSION" 2>/dev/null || git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null || true)

          sed '/^## [0-9][0-9.[:alpha:]-]*$/d; /^\*\*Full Changelog\*\*/d' /tmp/changelog.txt > /tmp/release_body.txt

          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: [%s...%s](https://github.com/%s/%s/compare/%s...%s)\n' \
              "$PREVIOUS_TAG" "$VERSION" "$REPO_OWNER" "$REPO_NAME" "$PREVIOUS_TAG" "$VERSION" \
              >> /tmp/release_body.txt
          fi

          cat >> /tmp/release_body.txt << FOOTER

          ---

          ### Downloads

          #### Android
          - **arm64**: \`SpotiFLAC-${VERSION}-arm64.apk\` (recommended for modern devices)
          - **arm32**: \`SpotiFLAC-${VERSION}-arm32.apk\` (older devices)
          - **x86_64**: \`SpotiFLAC-${VERSION}-x86_64.apk\` (emulators / ChromeOS)
          - **AAB**: \`SpotiFLAC-${VERSION}.aab\` (Play Console upload)
          - **checksums**: \`SHA256SUMS.txt\`

          #### iOS
          - **iOS**: \`SpotiFLAC-${VERSION}-ios-unsigned.ipa\` (sideload required)

          ### Installation
          **Android**: Enable "Install from unknown sources" and install the APK
          **iOS**: Use AltStore, Sideloadly, or similar tools to sideload the IPA
          FOOTER

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: SpotiFLAC-Mobile ${{ needs.get-version.outputs.version }}
          body_path: /tmp/release_body.txt
          files: |
            ./release/*.apk
            ./release/*.aab
            ./release/*.ipa
            ./release/SHA256SUMS.txt
          draft: false
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-altstore:
    runs-on: ubuntu-latest
    needs: [get-version, build-ios, create-release]
    if: ${{ needs.get-version.outputs.is_prerelease != 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download iOS IPA
        uses: actions/download-artifact@v7
        with:
          name: ios-ipa
          path: ./release

      - name: Update apps.json
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +%Y-%m-%d)
          IPA_FILE=$(find ./release -name "*ios*.ipa" | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "WARNING: IPA file not found, skipping apps.json update"
            exit 0
          fi

          IPA_SIZE=$(stat -c%s "$IPA_FILE" 2>/dev/null || stat -f%z "$IPA_FILE")

          if [ ! -f apps.json ]; then
            echo "WARNING: apps.json not found on main, skipping"
            exit 0
          fi

          jq --arg ver "$VERSION_NUM" \
             --arg date "$DATE" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/SpotiFLAC-${VERSION}-ios-unsigned.ipa" \
             --argjson size "$IPA_SIZE" \
             '.apps[0].version = $ver | .apps[0].versionDate = $date | .apps[0].downloadURL = $url | .apps[0].size = $size' \
             apps.json > apps.json.tmp && mv apps.json.tmp apps.json

      - name: Commit and push
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "chore: update AltStore source to ${VERSION}" && git push)

  notify-telegram:
    runs-on: ubuntu-latest
    needs: [get-version, create-release]
    if: ${{ needs.get-version.outputs.is_prerelease != 'true' }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: ./release

      - name: Download iOS IPA
        uses: actions/download-artifact@v7
        with:
          name: ios-ipa
          path: ./release

      - name: Generate changelog with git-cliff for Telegram
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/cliff_tg.txt

      - name: Convert changelog for Telegram
        id: changelog
        run: |
          if [ ! -s /tmp/cliff_tg.txt ]; then
            echo "See release notes on GitHub for details." > /tmp/changelog.txt
          else
            CHANGELOG=$(cat /tmp/cliff_tg.txt | \
              sed '/^## [0-9][0-9.[:alpha:]-]*$/d' | \
              sed '/^\*\*Full Changelog\*\*/d' | \
              sed 's/ by \[@[^]]*\](https:\/\/github\.com\/[^)]*)//g' | \
              sed 's/ by @[A-Za-z0-9_-]\+//g' | \
              sed 's/\[#\([0-9]*\)\]([^)]*)/\1/g' | \
              sed 's/\[@\([^]]*\)\]([^]*)/\1/g' | \
              sed 's/&/\&amp;/g' | \
              sed 's/</\&lt;/g' | \
              sed 's/>/\&gt;/g' | \
              sed 's/\*\*\([^*]*\)\*\*/<b>\1<\/b>/g' | \
              sed 's/^### \(.*\)$/<b>\1<\/b>/g' | \
              sed 's/^## \(.*\)$/<b>\1<\/b>/g' | \
              sed 's/^- /• /g')
            CHANGELOG=$(echo "$CHANGELOG" | head -c 2500 | sed '$d')
            echo "$CHANGELOG" > /tmp/changelog.txt
          fi

      - name: Send to Telegram Channel
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          CHANGELOG=$(cat /tmp/changelog.txt)
          ARM64_APK=$(find ./release -name "*arm64*.apk" | head -1)
          ARM32_APK=$(find ./release -name "*arm32*.apk" | head -1)

          printf '%s\n' \
            "<b>SpotiFLAC Mobile ${VERSION} Released!</b>" \
            "" \
            "<b>What's New:</b>" \
            "${CHANGELOG}" \
            "" \
            "<a href=\"https://github.com/${{ github.repository }}/releases/tag/${VERSION}\">View Release Notes</a>" \
            > /tmp/telegram_message.txt

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=$(cat /tmp/telegram_message.txt)" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" || true

          if [ -f "$ARM64_APK" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${ARM64_APK}" \
              -F caption="SpotiFLAC Mobile ${VERSION} - arm64 (recommended)"
          fi

          if [ -f "$ARM32_APK" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${ARM32_APK}" \
              -F caption="SpotiFLAC Mobile ${VERSION} - arm32"
          fi

          IOS_IPA=$(find ./release -name "*ios*.ipa" | head -1)
          if [ -f "$IOS_IPA" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${IOS_IPA}" \
              -F caption="SpotiFLAC Mobile ${VERSION} - iOS (unsigned, sideload required)"
          fi
